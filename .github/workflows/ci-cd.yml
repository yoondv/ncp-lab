name: CI-CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upload deployment script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.NCP_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NCP_SECRET_KEY }}
          AWS_DEFAULT_REGION: kr-standard
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -Eeuo pipefail

          readonly IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"

          mkdir deployment-package
          sed \
            "s|ghcr.io/yoondv/ncp-lab:latest|$IMAGE|" \
            deploy.sh > deployment-package/deploy.sh
          grep -Fq "readonly IMAGE=\"$IMAGE\"" deployment-package/deploy.sh

          echo "Packaging deployment for $IMAGE"
          zip -j deploy.sh.zip deployment-package/deploy.sh
          aws s3 cp deploy.sh.zip \
            s3://deploy-ghcr-bucket/deploy.sh.zip \
            --endpoint-url=https://kr.object.ncloudstorage.com

      - name: Trigger and monitor NCP SourceDeploy
        env:
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
        run: |
          set -Eeuo pipefail

          readonly API_URL="https://vpcsourcedeploy.apigw.ntruss.com"
          readonly PROJECT_NAME="ncp-lab"
          readonly STAGE_NAME="real"
          readonly SCENARIO_NAME="deploy-ghcr"

          ncp_request() {
            local method="$1"
            local uri="$2"
            local timestamp
            local signature

            timestamp="$(date +%s%3N)"
            signature="$(
              printf '%s %s\n%s\n%s' \
                "$method" "$uri" "$timestamp" "$NCP_ACCESS_KEY" \
                | openssl dgst -sha256 -hmac "$NCP_SECRET_KEY" -binary \
                | base64 \
                | tr -d '\n'
            )"

            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "x-ncp-apigw-timestamp: $timestamp" \
              --header "x-ncp-iam-access-key: $NCP_ACCESS_KEY" \
              --header "x-ncp-apigw-signature-v2: $signature" \
              --header "x-ncp-region_code: KR" \
              --header "Accept: application/json" \
              "$API_URL$uri"
          }

          project_response="$(ncp_request GET "/api/v1/project")"
          project_id="$(
            jq -er --arg name "$PROJECT_NAME" \
              '.result.projectList[] | select(.name == $name) | .id' \
              <<<"$project_response"
          )"

          stage_response="$(
            ncp_request GET "/api/v1/project/$project_id/stage"
          )"
          stage_id="$(
            jq -er --arg name "$STAGE_NAME" \
              '.result.stageList[] | select(.name == $name) | .id' \
              <<<"$stage_response"
          )"

          scenario_response="$(
            ncp_request GET \
              "/api/v1/project/$project_id/stage/$stage_id/scenario"
          )"
          scenario_id="$(
            jq -er --arg name "$SCENARIO_NAME" \
              '.result.scenarioList[] | select(.name == $name) | .id' \
              <<<"$scenario_response"
          )"

          deploy_response="$(
            ncp_request POST \
              "/api/v1/project/$project_id/stage/$stage_id/scenario/$scenario_id/deploy"
          )"
          history_id="$(jq -er '.result.historyId' <<<"$deploy_response")"

          readonly MAX_POLL_ATTEMPTS=60
          readonly POLL_INTERVAL_SECONDS=10

          echo "SourceDeploy started."

          for ((attempt = 1; attempt <= MAX_POLL_ATTEMPTS; attempt++)); do
            history_response="$(
              ncp_request GET "/api/v1/project/$project_id/history/$history_id"
            )"
            deployment_status="$(
              jq -er '.result.status' <<<"$history_response"
            )"

            echo "SourceDeploy status: $deployment_status ($attempt/$MAX_POLL_ATTEMPTS)"

            case "$deployment_status" in
              success)
                echo "SourceDeploy completed successfully."
                exit 0
                ;;
              fail | reject | canceled | error | canary_reject | canary_waiting_timeout)
                echo "SourceDeploy failed with status: $deployment_status" >&2
                exit 1
                ;;
              inprogress | pending | canceling | waiting | canary_pending | canary_analyzing | canary_rejecting)
                ;;
              *)
                echo "Unknown SourceDeploy status: $deployment_status" >&2
                exit 1
                ;;
            esac

            if [ "$attempt" -lt "$MAX_POLL_ATTEMPTS" ]; then
              sleep "$POLL_INTERVAL_SECONDS"
            fi
          done

          echo "SourceDeploy did not finish within 10 minutes." >&2
          exit 1
