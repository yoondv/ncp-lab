name: CI-CD

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: python -m pip install fastapi uvicorn

      - name: Check application
        run: python -c "from main import app; from fastapi import FastAPI; assert isinstance(app, FastAPI)"

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger NCP SourceDeploy
        env:
          NCP_ACCESS_KEY: ${{ secrets.NCP_ACCESS_KEY }}
          NCP_SECRET_KEY: ${{ secrets.NCP_SECRET_KEY }}
        run: |
          set -Eeuo pipefail

          readonly API_URL="https://vpcsourcedeploy.apigw.ntruss.com"
          readonly PROJECT_NAME="ncp-lab"
          readonly STAGE_NAME="real"
          readonly SCENARIO_NAME="deploy-ghcr"

          ncp_request() {
            local method="$1"
            local uri="$2"
            local timestamp
            local signature

            timestamp="$(date +%s%3N)"
            signature="$(
              printf '%s %s\n%s\n%s' \
                "$method" "$uri" "$timestamp" "$NCP_ACCESS_KEY" \
                | openssl dgst -sha256 -hmac "$NCP_SECRET_KEY" -binary \
                | base64 \
                | tr -d '\n'
            )"

            curl --fail-with-body --silent --show-error \
              --request "$method" \
              --header "x-ncp-apigw-timestamp: $timestamp" \
              --header "x-ncp-iam-access-key: $NCP_ACCESS_KEY" \
              --header "x-ncp-apigw-signature-v2: $signature" \
              --header "x-ncp-region_code: KR" \
              --header "Accept: application/json" \
              "$API_URL$uri"
          }

          project_response="$(ncp_request GET "/api/v1/project")"
          project_id="$(
            jq -er --arg name "$PROJECT_NAME" \
              '.result.projectList[] | select(.name == $name) | .id' \
              <<<"$project_response"
          )"

          stage_response="$(
            ncp_request GET "/api/v1/project/$project_id/stage"
          )"
          stage_id="$(
            jq -er --arg name "$STAGE_NAME" \
              '.result.stageList[] | select(.name == $name) | .id' \
              <<<"$stage_response"
          )"

          scenario_response="$(
            ncp_request GET \
              "/api/v1/project/$project_id/stage/$stage_id/scenario"
          )"
          scenario_id="$(
            jq -er --arg name "$SCENARIO_NAME" \
              '.result.scenarioList[] | select(.name == $name) | .id' \
              <<<"$scenario_response"
          )"

          deploy_response="$(
            ncp_request POST \
              "/api/v1/project/$project_id/stage/$stage_id/scenario/$scenario_id/deploy"
          )"
          history_id="$(jq -er '.result.historyId' <<<"$deploy_response")"
